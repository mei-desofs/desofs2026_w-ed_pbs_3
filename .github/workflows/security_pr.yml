name: Security Scan (PR) - SAST + SCA + DAST + Secrets

on:
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create reports folder
        run: mkdir -p reports

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install security tools
        run: |
          pip install bandit semgrep pip-audit safety

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.18.0
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path reports/gitleaks-report.json \
            --exit-code 0 || true

      - name: Run Bandit
        run: |
          bandit -r . \
            -f json \
            -o reports/bandit-report.json \
            || true

      - name: Run Semgrep
        run: |
          semgrep \
            --config=p/owasp-top-ten \
            --json \
            --output=reports/semgrep-report.json \
            . \
            || true

      - name: Run pip-audit
        run: |
          pip-audit \
            -r requirements.txt \
            --format=json \
            --output=reports/pip-audit-report.json \
            || true

      - name: Run Safety
        run: |
          safety check \
            -r requirements.txt \
            --output json \
            > reports/safety-report.json \
            || true

      - name: Create .env file
        run: |
          cat > docker/.env << EOF
          DB_HOST=db
          DB_USER=workspace_user
          DB_PASSWORD=workspace_password
          DB_NAME=workspace_db
          MYSQL_ROOT_PASSWORD=root_password
          WORKSPACE_URL=http://localhost:8000
          JWT_SECRET_KEY=your-secret-key-here
          JWT_AUD_KEY=your-aud-key-here
          WORKSPACE_SERVICE_TOKEN=workspace-token
          EOF

      - name: Start application
        run: |
          docker compose -f docker/docker-compose.yml up -d
          sleep 15

      - name: Wait for MySQL to be healthy
        run: |
          echo "Waiting for MySQL to be healthy..."
          for i in {1..60}; do
            if docker exec mysql_db mysqladmin ping -h localhost 2>/dev/null; then
              echo "MySQL is healthy!"
              sleep 5
              break
            fi
            echo "Attempt $i/60: MySQL not ready..."
            sleep 5
          done
          
          docker compose -f docker/docker-compose.yml ps
          if ! docker compose -f docker/docker-compose.yml ps | grep -q "mysql_db.*Up"; then
            echo "ERROR: MySQL container is not running"
            docker logs mysql_db
            exit 1
          fi

      - name: Wait for API
        run: |
          echo "Waiting for Flask API to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:5003 > /dev/null 2>&1; then
              echo "API is up!"
              exit 0
            fi
            echo "Attempt $i/60: API not ready, waiting..."
            sleep 5
          done
          
          echo "API failed to start after 5 minutes"
          docker compose -f docker/docker-compose.yml logs > reports/docker-services.log 2>&1
          exit 1

      - name: Save container logs
        if: always()
        run: |
          docker logs flask_api > reports/docker-web.log 2>&1 || true
          docker logs mysql_db > reports/docker-mysql.log 2>&1 || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:5003"
          allow_issue_writing: false
          cmd_options: "-I"
          artifact_name: zap-report

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      - name: Stop containers
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v