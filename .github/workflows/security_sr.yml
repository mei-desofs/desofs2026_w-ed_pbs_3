name: Security Scan (PR) - SAST + SCA + DAST + Secrets

on:
  pull_request:
    branches:
      - main

jobs:

  security-scan:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Create reports folder
      - name: Create reports folder
        run: mkdir -p reports

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Install security tools
      - name: Install security tools
        run: |
          pip install bandit semgrep pip-audit safety

      # GITLEAKS (Secrets Scan)
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.18.0
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path reports/gitleaks-report.json \
            --exit-code 0 || true

      # SAST
      - name: Run Bandit
        run: |
          bandit -r . \
            -f json \
            -o reports/bandit-report.json \
            || true

      - name: Run Semgrep
        run: |
          semgrep \
            --config=p/owasp-top-ten \
            --json \
            --output=reports/semgrep-report.json \
            . \
            || true

      # SCA
      - name: Run pip-audit
        run: |
          pip-audit \
            -r requirements.txt \
            --format=json \
            --output=reports/pip-audit-report.json \
            || true

      - name: Run Safety
        run: |
          safety check \
            -r requirements.txt \
            --output json \
            > reports/safety-report.json \
            || true

      # DAST (OWASP ZAP)
      - name: Create .env file
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> docker/.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> docker/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> docker/.env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> docker/.env
          echo "WORKSPACE_URL=${{ secrets.WORKSPACE_URL }}" >> docker/.env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> docker/.env

      - name: Start application
        run: |
          docker compose -f docker/docker-compose.yml up -d

      - name: Wait for API
        run: |
          echo "Waiting for API..."

          for i in {1..30}; do
            if curl -s http://localhost:5003 > /dev/null; then
              echo "API is up!"
              exit 0
            fi
            sleep 5
          done

          echo "API failed to start"
          docker logs flask_api > reports/docker-web.log 2>&1 || true
          exit 1

      - name: Save container logs
        if: always()
        run: |
          docker logs flask_api > reports/docker-web.log 2>&1 || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:5003"
          allow_issue_writing: false
          cmd_options: "-I"
          artifact_name: zap-report

      # UPLOAD ALL REPORTS
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      # CLEANUP
      - name: Stop containers
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v