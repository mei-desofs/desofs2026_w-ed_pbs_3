name: Security Scan (PR) - SAST + SCA + DAST + Secrets

on:
  pull_request:
    branches:
      - main

jobs:

  security-scan:
    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GITLEAKS
      - name: Run Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SAST
      - name: Install SAST tools
        run: |
          pip install bandit semgrep

      - name: Run Bandit
        run: |
          bandit -r . \
          -f json \
          -o bandit-report.json || true

      - name: Run Semgrep
        run: |
          semgrep \
          --config=p/owasp-top-ten \
          --json \
          --output=semgrep-report.json \
          . || true

      # SCA
      - name: Install SCA tools
        run: |
          pip install pip-audit safety

      - name: Run pip-audit
        run: |
          pip-audit \
          -r requirements.txt \
          --format=json \
          --output=pip-audit-report.json || true

      - name: Run Safety
        run: |
          safety scan \
          --target requirements.txt \
          --output json > safety-report.json || true

      # DAST
      - name: Create .env file
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> docker/.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> docker/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> docker/.env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> docker/.env
          echo "WORKSPACE_URL=${{ secrets.WORKSPACE_URL }}" >> docker/.env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> docker/.env

      - name: Start application
        run: |
          docker compose -f docker/docker-compose.yml up -d

      - name: Wait for API
        run: |
          echo "Waiting for API..."

          for i in {1..30}; do
            if curl -s http://localhost:5003 > /dev/null; then
              echo "API is up!"
              exit 0
            fi

            sleep 5
          done

          echo "API failed to start"

          docker logs flask_api > docker-web.log 2>&1 || true

          exit 1

      - name: Save container logs
        if: always()
        run: |
          docker logs flask_api > docker-web.log 2>&1 || true

      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5003"
          allow_issue_writing: false
          cmd_options: "-I"
          artifact_name: zap-report

      # UPLOAD REPORTS
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            pip-audit-report.json
            safety-report.json
            docker-web.log

      # CLEANUP
      - name: Stop containers
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v