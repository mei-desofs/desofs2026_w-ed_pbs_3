name: Security Scan (Push) - SAST + SCA + Secrets

on:
  push:

jobs:

  security-scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install security tools
        run: |
          pip install bandit semgrep pip-audit safety

      - name: Create reports folder
        run: mkdir -p reports

      # GITLEAKS
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.18.0
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path reports/gitleaks-report.json \
            --exit-code 0

      # BANDIT
      - name: Run Bandit
        run: |
          bandit -r . -f json -o reports/bandit-report.json || true

      # SEMGREP
      - name: Run Semgrep
        run: |
          semgrep --config=p/owasp-top-ten --json --output=reports/semgrep-report.json . || true

      # PIP-AUDIT
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --format=json > reports/pip-audit-report.json || true

      # SAFETY
      - name: Run Safety
        run: |
          safety check -r requirements.txt --output json > reports/safety-report.json || true

      # Upload reports
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/