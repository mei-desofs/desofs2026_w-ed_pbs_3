name: Security Scan (Push) - SAST + SCA + Secrets

on:
  push:

jobs:

  security-scan:
    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Security tools
      - name: Install security tools
        run: |
          pip install bandit semgrep pip-audit safety

      # GITLEAKS
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # BANDIT
      - name: Run Bandit
        run: |
          mkdir -p reports
          bandit -r . -f json -o reports/bandit-report.json || true

      # SEMGREP
      - name: Run Semgrep
        run: |
          semgrep --config=p/owasp-top-ten --json --output=reports/semgrep-report.json . || true

      # PIP-AUDIT
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --format=json > reports/pip-audit-report.json || true

      # SAFETY
      - name: Run Safety
        run: |
          safety check -r requirements.txt --json > reports/safety-report.json || true

      # Upload reports
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/