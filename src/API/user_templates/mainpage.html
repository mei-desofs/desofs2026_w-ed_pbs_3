<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/login.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>MarkDawn</title>
</head>

<body>
    <h1>Bem vindo, <span id="userEmail"></span></h1>
</body>

<script>
    fetch("{{ url_for('users.get_current_user') }}")
        .then(res => res.json())
        .then(data => {
            document.getElementById("userEmail").textContent = data.logged_as;
        });
</script>
