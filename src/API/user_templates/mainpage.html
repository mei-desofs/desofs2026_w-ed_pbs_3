<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{{ url_for('users.static', filename='js/api.js') }}"></script>
    <title>MarkDawn</title>
</head>

<body>

<h1>Bem vindo, <span id="userEmail"></span></h1>

<button
    class="btn btn-outline-danger float-end"
    onclick="logout()">
    Terminar Sessão
</button>

<div class="mt-3">
    <input id="workspaceNameInput" class="form-control" placeholder="Nome do workspace">
</div>

<button class="btn btn-primary mt-2" onclick="createWorkspace()">
    Criar Workspace
</button>

<h3 class="mt-4">Workspaces</h3>

<ul id="workspaceList" class="list-group mt-2"></ul>

<hr>

<h3>Workspace Atual</h3>

<p id="currentWorkspace">
    Nenhum workspace selecionado
</p>

<input
    id="docTitle"
    class="form-control mt-2"
    placeholder="Título do documento">

<textarea
    id="docContent"
    class="form-control mt-2"
    rows="8"
    placeholder="Conteúdo markdown">
</textarea>

<button
    class="btn btn-success mt-2"
    onclick="createDocument()">
    Criar Documento
</button>

<h4 class="mt-4">Documentos</h4>

<ul id="documentList" class="list-group"></ul>

</body>

<script>
    let selectedWorkspaceId = null;
    let currentDocumentId = null;

apiRequest("{{ url_for('users.get_current_user') }}")
    .then(res => res.json())
    .then(data => {
        if (data?.logged_as) {
            document.getElementById("userEmail").textContent = data.logged_as;
        }
    });

function createWorkspace() {
    const name = document.getElementById("workspaceNameInput").value;

    if (!name) {
        alert("Introduz um nome para o workspace");
        return;
    }

    apiRequest("/workspaces/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
    })
    .then(res => res.json())
    .then(() => {
        document.getElementById("workspaceNameInput").value = "";
        loadWorkspaces();
    });
}

function deleteWorkspace(workspaceId) {

    if (!confirm("Pretende eliminar este workspace?")) {
        return;
    }

    apiRequest(`/workspaces/${workspaceId}`, {
        method: "DELETE"
    })
    .then(res => res.json())
    .then(() => {
        loadWorkspaces();
    });
}

function loadWorkspaces() {
    apiRequest("/workspaces")
        .then(res => res.json())
        .then(data => {

            const list = document.getElementById("workspaceList");
            list.innerHTML = "";

            data.workspaces.forEach(ws => {

                const li = document.createElement("li");
                li.className = "list-group-item";

                li.innerHTML = `
                    <b>${ws.name}</b>
                    <small class="d-block text-muted">${ws.created_at}</small>

                    <button
                        class="btn btn-primary btn-sm mt-2"
                        onclick="openWorkspace('${ws.id}','${ws.name}')">
                        Abrir
                    </button>

                    <button
                        class="btn btn-danger btn-sm mt-2"
                        onclick="deleteWorkspace('${ws.id}')">
                        Eliminar
                    </button>
                `;

                list.appendChild(li);
            });
        });
}

function logout() {

    apiRequest("/logout", {
        method: "POST"
    })
    .then(res => res.json())
    .then(data => {

        window.location.href = data.redirect;

    });
}

function openWorkspace(workspaceId, workspaceName) {

    selectedWorkspaceId = workspaceId;

    document.getElementById("currentWorkspace").innerText =
        workspaceName;

    loadDocuments();
}

function createDocument() {

    if (!selectedWorkspaceId) {
        alert("Selecione um workspace");
        return;
    }

    const title = document.getElementById("docTitle").value;
    const content = document.getElementById("docContent").value;

    apiRequest("/documents", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            workspace_id: selectedWorkspaceId,
            title: title,
            content: content
        })
    })
    .then(res => res.json())
    .then(() => {

        document.getElementById("docTitle").value = "";
        document.getElementById("docContent").value = "";

        loadDocuments();
    });
}

function loadDocuments() {

    if (!selectedWorkspaceId) {
        return;
    }

    apiRequest(`/documents/${selectedWorkspaceId}`)
        .then(res => res.json())
        .then(data => {

            const list =
                document.getElementById("documentList");

            list.innerHTML = "";

            data.documents.forEach(doc => {

                const li =
                    document.createElement("li");

                li.className =
                    "list-group-item";

                li.innerHTML = `
                    <b>${doc.title}</b>

                    <small class="d-block text-muted">
                        ${doc.created_at}
                    </small>

                    <button
                        class="btn btn-primary btn-sm mt-2"
                        onclick="openDocument('${doc.id}')">
                        Abrir Documento
                    </button>
                `;

                list.appendChild(li);
            });
        });
}

function openDocument(documentId) {

    apiRequest(`/document/${documentId}`)
        .then(res => res.json())
        .then(doc => {

            document.getElementById("docTitle").value =
                doc.title;

            document.getElementById("docContent").value =
                doc.markdown_content;

            currentDocumentId = doc.id;
        });
}

document.addEventListener("DOMContentLoaded", loadWorkspaces);

</script>

</html>
