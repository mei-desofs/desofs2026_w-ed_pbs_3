<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">

    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'none';
        object-src 'none';
        frame-ancestors 'none';
        form-action 'none';
        script-src 'self';
        style-src 'self' https://cdn.jsdelivr.net;
        img-src 'self' data:;
        connect-src 'self';
        upgrade-insecure-requests;
        block-all-mixed-content;
      ">

    <meta name="referrer" content="no-referrer">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content p,
        .markdown-content ul,
        .markdown-content ol {
            display: block;
            margin-bottom: 0.75rem;
        }

        .markdown-content ul,
        .markdown-content ol {
            padding-left: 1.5rem;
        }

        .markdown-content li {
            margin-bottom: 0.25rem;
        }
    </style>
</head>

<body class="container mt-4">

    <h2>{{ title }}</h2>

    <hr>

    <div class="card">
        <div class="card-body markdown-content">
            {{ content | safe }}
        </div>
    </div>

    <hr>

</body>
</html>
