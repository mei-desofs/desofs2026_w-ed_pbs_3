<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>MarkDawn</title>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Alterar Password</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="current_password" class="form-label">Current Password</label>
                                <input id="current_password" name="current_password" class="form-control" type="password" placeholder="Enter your current password">
                            </div>
                            <div class="mb-3">
                                <label for="new_password" class="form-label">New Password</label>
                                <input type="password" name="new_password" class="form-control" id="new_password" placeholder="Enter your new password">
                            </div>
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">Confirm New Password</label>
                                <input type="password" name="confirm_password" class="form-control" id="confirm_password" placeholder="Confirm your new password">
                            </div> <button type="submit" class="btn btn-primary">Alterar Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const current_password = document.getElementById("current_password").value;
        const new_password = document.getElementById("new_password").value;
        const confirm_password = document.getElementById("confirm_password").value;

        try {
            const response = await fetch("{{ url_for('users.change_password') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({

                    current_password: current_password, 
                    new_password: new_password,
                    confirm_password: confirm_password
                })
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = data.redirect;
            } else {
                alert(data.error || "Ocorreu um erro ao alterar a password.");
            }
        } catch (error) {
            console.error("Erro na requisição:", error);
            alert("Erro de ligação ao servidor.");
        }
    });
    </script>
</body>
</html>
